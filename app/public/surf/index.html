    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #6f6894;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas.held {
        cursor: grabbing;
      }
      #logo {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 2px 12px 2px 6px;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        text-shadow: 1px 1px 0 #2c2547;
        background: rgb(44 37 71 / 55%);
        border: 1px solid rgb(255 255 255 / 45%);
        transition: background 0.15s;
      }
      #logo:hover,
      #logo:focus-visible {
        background: #d979d6;
      }
      #logo:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      #logo img {
        width: 40px;
        height: 40px;
        image-rendering: pixelated;
      }
      #flips {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        line-height: 44px;
        text-shadow: 1px 1px 0 #2c2547;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: max(14px, env(safe-area-inset-bottom));
        color: #fff;
        font-size: 14px;
        text-align: center;
        text-shadow: 1px 1px 0 #2c2547;
        pointer-events: none;
        transition: opacity 0.6s;
      }
      .hidden {
        opacity: 0;
      }
      /* #still: how the share images are captured */
      .still #logo {
        top: 9%;
        left: 7%;
        padding: 0;
        gap: 22px;
        font-size: 72px;
        background: none;
        border: 0;
        text-shadow: 3px 3px 0 #2c2547;
      }
      .still #logo img {
        width: 150px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <canvas id="sea" tabindex="0" role="img" aria-label="A fumo milady surfing on waves. Press space to jump, and the arrow keys to paddle."></canvas>
    <a id="logo" href="https://www.miyamaker.com/" target="_blank" rel="noopener" aria-label="Go to miyamaker.com">
      <img src="./logo.png" alt="" />
      miyamaker
    </a>
    <div id="flips" aria-live="polite"></div>
    <div id="hint">Tap to jump. Throw the fumo. Poke the water.</div>
    <script src="./surf.js"></script>
  </body>
</html>
